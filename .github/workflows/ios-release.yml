name: iOS Release (TestFlight)

on:
  push:
    branches:
      - 'release-*'   # для веток вида release-1.0
      - 'release/**'  # и для release/1.0.0
  workflow_dispatch:

jobs:
  build-upload:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: arm64

      - name: Flutter pub get (generate ios/Flutter/Generated.xcconfig)
        run: flutter pub get

      - name: CocoaPods update (refresh Podfile.lock to latest Firebase)
        run: |
          cd ios
          pod repo update
          pod update

      - name: Install fastlane
        run: |
          cd ios
          gem install fastlane

      - name: Build and upload with fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }} # <-- опционально, см. примечания
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd ios
          fastlane ci_release
