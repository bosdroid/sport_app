name: iOS Release (TestFlight)

on:
  push:
    branches:
      - 'release-*'
      - 'release/**'
  workflow_dispatch:

jobs:
  build-upload:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: arm64

      - name: Flutter pub get
        run: |
          set -euo pipefail
          echo "START: flutter pub get"
          flutter pub get
          echo "DONE: flutter pub get"

      # ---- SSH для доступа к ios-certs -------------------------------------
      - name: Setup SSH for match (deploy key)
        shell: bash
        env:
          MATCH_SSH_KEY: ${{ secrets.MATCH_SSH_KEY }}  # приватный ключ (OpenSSH или base64)
        run: |
          set -euo pipefail
          if [ -z "${MATCH_SSH_KEY:-}" ]; then
            echo "MATCH_SSH_KEY is empty"
            exit 1
          fi
          mkdir -p ~/.ssh
          CLEAN=$(printf '%s' "$MATCH_SSH_KEY" | tr -d '\r')
          if printf '%s' "$CLEAN" | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            printf '%s\n' "$CLEAN" > ~/.ssh/match_rsa
          else
            printf '%s' "$CLEAN" | base64 -d > ~/.ssh/match_rsa || {
              echo "MATCH_SSH_KEY is neither OpenSSH private key nor valid base64"
              exit 1
            }
          fi
          chmod 600 ~/.ssh/match_rsa
          if ! ssh-keygen -y -f ~/.ssh/match_rsa >/dev/null 2>&1; then
            echo "Invalid private key format in MATCH_SSH_KEY"
            exit 1
          fi
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/match_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git ls-remote git@github.com:bosdroid/ios-certs.git >/dev/null
          echo "SSH access to ios-certs OK"

      # ---- CocoaPods --------------------------------------------------------
      - name: CocoaPods install
        run: |
          set -euo pipefail
          cd ios
          pod repo update --no-ansi
          pod update Firebase/Storage --no-ansi || true
          pod install --no-ansi
          echo "DONE: CocoaPods install"

      - name: Install fastlane
        run: |
          set -euo pipefail
          cd ios
          gem install fastlane
          echo "DONE: fastlane installed"

      # === Жёстко проставляем bundle id и team ДО любых проверок
      - name: Fastlane fix identifiers (bundle id & team)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cd ios
          fastlane fix_ids
          echo "DONE: identifiers fixed"

      # --- Преддиагностика Xcode --------------------------------------------
      - name: Preflight — verify workspace and settings
        run: |
          set -euo pipefail
          cd ios
          if [ ! -d "Runner.xcworkspace" ]; then
            echo "Runner.xcworkspace NOT FOUND"
            exit 1
          fi
          echo "== Available schemes =="
          xcodebuild -list -workspace Runner.xcworkspace || true
          echo
          echo "== Ensure 'Runner' scheme exists and is SHARED =="
          if ! xcodebuild -list -workspace Runner.xcworkspace | grep -E '^(\s*)Runner$' >/dev/null; then
            echo "Scheme 'Runner' not found (или не Shared). Открой проект локально и сделай Product -> Scheme -> Manage Schemes... -> Share."
            exit 1
          fi
          echo
          echo "== Key build settings (grep) =="
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -showBuildSettings | egrep "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE" || true

      # --- Проверяем по Info.plist (а не по showBuildSettings)
      - name: Assert expected identifiers
        env:
          EXPECTED_BUNDLE_ID: com.drillbox.app
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cd ios
          BID_PLIST=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "Runner/Info.plist")
          echo "Info.plist CFBundleIdentifier=$BID_PLIST"
          TEAM=$(xcodebuild -workspace Runner.xcworkspace -scheme Runner -showBuildSettings | awk -F= '/^[[:space:]]*DEVELOPMENT_TEAM[[:space:]]*=/{gsub(/[[:space:]]/,"",$2);print $2; exit}')
          echo "Detected DEVELOPMENT_TEAM=$TEAM"
          test "$BID_PLIST" = "$EXPECTED_BUNDLE_ID" || { echo "Bundle id mismatch! Expected $EXPECTED_BUNDLE_ID"; exit 1; }
          test "$TEAM" = "$EXPECTED_TEAM_ID" || { echo "Team id mismatch! Expected $EXPECTED_TEAM_ID"; exit 1; }
          echo "Identifiers OK"

      - name: Preflight compile (no signing)
        run: |
          set -euo pipefail
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Automatic \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="" \
            build

      - name: Flutter build iOS (no codesign)
        run: |
          set -euo pipefail
          echo "START: flutter build ios"
          flutter clean
          flutter build ios --release --no-codesign --build-number ${{ github.run_number }}
          echo "DONE: flutter build ios"

      - name: Build and upload with fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}   # base64 p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: git@github.com:bosdroid/ios-certs.git
          MATCH_GIT_BRANCH: ${{ secrets.MATCH_GIT_BRANCH }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_SSH_KEY: ${{ secrets.MATCH_SSH_KEY }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_DISABLE_COLORS: "1"
          GYM_VERBOSE: "true"
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          CLEAN=$(printf '%s' "$MATCH_SSH_KEY" | tr -d '\r')
          if printf '%s' "$CLEAN" | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            printf '%s\n' "$CLEAN" > ~/.ssh/match_rsa
          else
            printf '%s' "$CLEAN" | base64 -d > ~/.ssh/match_rsa
          fi
          chmod 600 ~/.ssh/match_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/match_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          cd ios

          # Печатаем хвост gym-лога при падении, чтобы видеть первопричину Exit 65
          set +e
          fastlane ci_release
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "===== Tail of latest gym log ====="
            LATEST_LOG=$(ls -t ~/Library/Logs/gym/*/*.log 2>/dev/null | head -n1 || true)
            if [ -n "${LATEST_LOG:-}" ] && [ -f "$LATEST_LOG" ]; then
              tail -n 400 "$LATEST_LOG" || true
            else
              echo "No gym log found at ~/Library/Logs/gym"
            fi
            # Выполним ручной archive, чтобы снять полный сырой лог xcodebuild
            echo "===== Running raw xcodebuild archive for diagnostics ====="
            xcodebuild \
              -workspace Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -archivePath "$PWD/build/Runner.xcarchive" \
              -destination "generic/platform=iOS" \
              -allowProvisioningUpdates \
              DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
              CODE_SIGN_STYLE=Automatic \
              PROVISIONING_PROFILE_SPECIFIER="" \
              PROVISIONING_PROFILE="" \
              clean archive | tee "$PWD/xcodebuild-archive.log"
            exit $STATUS
          fi

          echo "DONE: fastlane ci_release"

      # После match/sigh посмотрим, что реально установилось
      - name: Post-match diagnostics
        if: failure()
        run: |
          set -euo pipefail
          security find-identity -v -p codesigning || true
          echo "--- Profiles ---"
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles/ || true

      - name: Verify TestFlight (latest build number)
        if: success()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          set -euo pipefail
          cd ios
          fastlane verify_tf

      - name: Upload artifacts (IPA and logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-and-logs
          path: |
            ios/*.ipa
            ios/xcodebuild-archive.log
            ios/build/**/*.{xcarchive,log}
            ~/Library/Logs/gym/**/*
            ~/Library/Logs/scan/**/*
            ~/Library/Logs/fastlane/**/*
            ~/Library/Logs/Transporter/**/*
