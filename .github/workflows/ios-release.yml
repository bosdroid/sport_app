name: iOS Release (TestFlight)

on:
  push:
    branches:
      - 'release-*'
      - 'release/**'
  workflow_dispatch:

jobs:
  build-upload:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: arm64

      - name: Flutter pub get
        run: |
          set -euo pipefail
          echo "START: flutter pub get"
          flutter pub get
          echo "DONE: flutter pub get"

      # ---- SSH для доступа к ios-certs -------------------------------------
      - name: Setup SSH for match (deploy key)
        shell: bash
        env:
          MATCH_SSH_KEY: ${{ secrets.MATCH_SSH_KEY }}  # приватный ключ (OpenSSH или base64 от него)
        run: |
          set -euo pipefail
          if [ -z "${MATCH_SSH_KEY:-}" ]; then
            echo "MATCH_SSH_KEY is empty"
            exit 1
          fi
          mkdir -p ~/.ssh
          CLEAN=$(printf '%s' "$MATCH_SSH_KEY" | tr -d '\r')
          if printf '%s' "$CLEAN" | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            printf '%s\n' "$CLEAN" > ~/.ssh/match_rsa
          else
            printf '%s' "$CLEAN" | base64 -d > ~/.ssh/match_rsa || {
              echo "MATCH_SSH_KEY is neither OpenSSH private key nor valid base64"
              exit 1
            }
          fi
          chmod 600 ~/.ssh/match_rsa
          if ! ssh-keygen -y -f ~/.ssh/match_rsa >/dev/null 2>&1; then
            echo "Invalid private key format in MATCH_SSH_KEY"
            exit 1
          fi
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/match_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git ls-remote git@github.com:bosdroid/ios-certs.git >/dev/null
          echo "SSH access to ios-certs OK"

      # ---- CocoaPods: точечный апдейт Firebase/Storage для согласования lock ----
      - name: CocoaPods install
        run: |
          set -euo pipefail
          cd ios
          pod repo update --no-ansi
          pod update Firebase/Storage --no-ansi
          pod install --no-ansi
          echo "DONE!: CocoaPods install"

      - name: Install fastlane
        run: |
          set -euo pipefail
          cd ios
          gem install fastlane
          echo "DONE: fastlane installed"

      - name: Flutter build iOS (no codesign)
        run: |
          set -euo pipefail
          echo "START: flutter build ios"
          flutter clean
          flutter build ios --release --no-codesign --build-number ${{ github.run_number }}
          echo "DONE: flutter build ios"

      # --- ПРЕДДИАГНОСТИКА Xcode: workspace, scheme, настройки ----------------
      - name: Preflight — verify workspace & scheme & settings
        run: |
          set -euo pipefail
          cd ios
          echo "== ls ios =="
          ls -la
          echo
          if [ ! -d "Runner.xcworkspace" ]; then
            echo "Runner.xcworkspace NOT FOUND. Проверь pod install/flutter build ios."
            exit 1
          fi
          echo "== xcodebuild -list (workspace) =="
          xcodebuild -list -workspace Runner.xcworkspace || true
          echo
          echo "== ensure 'Runner' scheme exists and is SHARED =="
          if ! xcodebuild -list -workspace Runner.xcworkspace | grep -E '^(\s*)Runner$' >/dev/null; then
            echo "Scheme 'Runner' not found (или не Shared). Открой проект локально и включи 'Shared' у схемы Runner."
            exit 1
          fi
          echo
          echo "== showBuildSettings (bundle/team/signing) =="
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -showBuildSettings | egrep "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE" || true
          echo
          echo "Preflight OK"

      - name: Build and upload with fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}   # base64 содержимого .p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: git@github.com:bosdroid/ios-certs.git
          MATCH_GIT_BRANCH: ${{ secrets.MATCH_GIT_BRANCH }} # опционально; по умолчанию main
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}     # пароль шифрования match
          MATCH_SSH_KEY: ${{ secrets.MATCH_SSH_KEY }}       # тот же секрет
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_DISABLE_COLORS: "1"
          GYM_VERBOSE: "true"
        run: |
          # Важно: печатаем хвост gym-лога при падении
          set -euo pipefail
          mkdir -p ~/.ssh
          CLEAN=$(printf '%s' "$MATCH_SSH_KEY" | tr -d '\r')
          if printf '%s' "$CLEAN" | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            printf '%s\n' "$CLEAN" > ~/.ssh/match_rsa
          else
            printf '%s' "$CLEAN" | base64 -d > ~/.ssh/match_rsa
          fi
          chmod 600 ~/.ssh/match_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/match_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          cd ios

          set +e
          fastlane ci_release
          STATUS=$?
          set -e

          if [ $STATUS -ne 0 ]; then
            echo "===== Tail of latest gym log ====="
            LATEST_LOG=$(ls -t ~/Library/Logs/gym/*/*.log 2>/dev/null | head -n1 || true)
            if [ -n "${LATEST_LOG:-}" ] && [ -f "$LATEST_LOG" ]; then
              tail -n 400 "$LATEST_LOG" || true
            else
              echo "No gym log found at ~/Library/Logs/gym"
            fi
            exit $STATUS
          fi

          echo "DONE: fastlane ci_release"

      # --- Автосбор логов при падении ---------------------------------------
      - name: Upload build logs (gym/scan/fastlane)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-fastlane-logs
          path: |
            ~/Library/Logs/gym/**/*
            ~/Library/Logs/scan/**/*
            ~/Library/Logs/fastlane/**/*
            ios/build/**/*
