name: iOS Release (TestFlight)

on:
  push:
    branches:
      - 'release-*'
      - 'release/**'
  workflow_dispatch:

jobs:
  build-upload:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: arm64

      - name: Flutter pub get
        run: |
          set -euo pipefail
          echo "START: flutter pub get"
          flutter pub get
          echo "DONE: flutter pub get"

      - name: Sanity: can clone match repo?
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          set -euo pipefail
          if [ -z "${MATCH_GIT_URL:-}" ] || [ -z "${MATCH_GIT_BASIC_AUTHORIZATION:-}" ]; then
            echo "MATCH_GIT_URL or MATCH_GIT_BASIC_AUTHORIZATION is empty"
            exit 1
          fi
          git -c credential.helper= -c http.extraheader="Authorization: $MATCH_GIT_BASIC_AUTHORIZATION" ls-remote "$MATCH_GIT_URL" >/dev/null
          echo "Match repo reachable"

      - name: CocoaPods update
        run: |
          set -euo pipefail
          cd ios
          pod repo update --no-ansi
          pod update --no-ansi
          echo "DONE: CocoaPods update"

      - name: Install fastlane
        run: |
          set -euo pipefail
          cd ios
          gem install fastlane
          echo "DONE: fastlane installed"

      - name: Flutter build iOS (no codesign)
        run: |
          set -euo pipefail
          echo "START: flutter build ios"
          flutter clean
          flutter build ios --release --no-codesign --build-number ${{ github.run_number }}
          echo "DONE: flutter build ios"

      - name: Build and upload with fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_BRANCH: ${{ secrets.MATCH_GIT_BRANCH }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_DISABLE_COLORS: "1"
        run: |
          set -euo pipefail
          cd ios
          fastlane ci_release
          echo "DONE: fastlane ci_release"
