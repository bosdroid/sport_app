name: iOS Release (TestFlight)

on:
  push:
    branches:
      - 'release-*'
      - 'release/**'
  workflow_dispatch:

jobs:
  build-upload:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: arm64

      - name: Flutter pub get
        run: |
          set -euo pipefail
          echo "START: flutter pub get"
          flutter pub get
          echo "DONE: flutter pub get"

      # ---- SSH для доступа к ios-certs -------------------------------------
      - name: Setup SSH for match (deploy key)
        shell: bash
        env:
          MATCH_SSH_KEY: ${{ secrets.MATCH_SSH_KEY }}  # приватный ключ (сырой OpenSSH ИЛИ base64)
        run: |
          set -euo pipefail
          if [ -z "${MATCH_SSH_KEY:-}" ]; then
            echo "MATCH_SSH_KEY is empty"
            exit 1
          fi

          mkdir -p ~/.ssh

          # Нормализуем секрет:
          # - убираем возможные \r
          # - если это base64 (нет строки BEGIN), декодируем
          # - иначе считаем, что это сырой приватный ключ OpenSSH
          CLEAN=$(printf '%s' "$MATCH_SSH_KEY" | tr -d '\r')
          if printf '%s' "$CLEAN" | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            printf '%s\n' "$CLEAN" > ~/.ssh/match_rsa
          else
            # Пытаемся декодировать как base64 -> OpenSSH приватный ключ
            printf '%s' "$CLEAN" | base64 -d > ~/.ssh/match_rsa || {
              echo "MATCH_SSH_KEY is neither OpenSSH private key nor valid base64"
              exit 1
            }
          fi

          chmod 600 ~/.ssh/match_rsa

          # Проверим, что файл действительно приватный ключ: извлечём публичную часть
          if ! ssh-keygen -y -f ~/.ssh/match_rsa >/dev/null 2>&1; then
            echo "Invalid private key format in MATCH_SSH_KEY (cannot parse with ssh-keygen)."
            echo "Make sure the secret contains the FULL OpenSSH private key (BEGIN/END) or base64 of it."
            exit 1
          fi

          # known_hosts + переменная окружения для git/ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/match_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          # Проверяем доступ к приватному репозиторию через SSH
          git ls-remote git@github.com:bosdroid/ios-certs.git >/dev/null
          echo "SSH access to ios-certs OK"

      - name: CocoaPods update
        run: |
          set -euo pipefail
          cd ios
          pod repo update --no-ansi
          pod update --no-ansi
          echo "DONE!: CocoaPods update"

      - name: Install fastlane
        run: |
          set -euo pipefail
          cd ios
          gem install fastlane
          echo "DONE: fastlane installed"

      - name: Flutter build iOS (no codesign)
        run: |
          set -euo pipefail
          echo "START: flutter build ios"
          flutter clean
          flutter build ios --release --no-codesign --build-number ${{ github.run_number }}
          echo "DONE: flutter build ios"

      - name: Build and upload with fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}   # base64 содержимого .p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: git@github.com:bosdroid/ios-certs.git
          MATCH_GIT_BRANCH: ${{ secrets.MATCH_GIT_BRANCH }} # опционально; по умолчанию main
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}     # пароль шифрования match
          MATCH_SSH_KEY: ${{ secrets.MATCH_SSH_KEY }}       # используем тот же секрет
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_DISABLE_COLORS: "1"
        run: |
          set -euo pipefail
          # Настроим SSH и в этом шаге (новая оболочка)
          mkdir -p ~/.ssh
          CLEAN=$(printf '%s' "$MATCH_SSH_KEY" | tr -d '\r')
          if printf '%s' "$CLEAN" | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            printf '%s\n' "$CLEAN" > ~/.ssh/match_rsa
          else
            printf '%s' "$CLEAN" | base64 -d > ~/.ssh/match_rsa
          fi
          chmod 600 ~/.ssh/match_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/match_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          cd ios
          fastlane ci_release
          echo "DONE: fastlane ci_release"
